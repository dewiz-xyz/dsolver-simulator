# Route policies hold the routing nuances that do not belong in the plain chain protocol lists.
[[route_policies]]
id = "ethereum"

# ERC4626 is the one case where direction really matters, so it stays explicit here.
# USDS / sUSDS
[[route_policies.erc4626_pairs]]
asset = "0xdC035D45d973E3EC169d2276DDab16f1e407384F"
share = "0xa3931d71877c0e7a3148cb7eb4463524fec27fbd"
allow_asset_to_share = true
allow_share_to_asset = true

# USDC / sUSDC
[[route_policies.erc4626_pairs]]
asset = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
share = "0xBc65ad17c5C0a2A4D159fa5a503f4992c7B545FE"
allow_asset_to_share = true
allow_share_to_asset = true

# PYUSD / spPYUSD
[[route_policies.erc4626_pairs]]
asset = "0x6c3ea9036406852006290770BEdFcAbA0e23A0e8"
share = "0x80128DbB9f07b93DDE62A6daeadb69ED14a7D354"
allow_asset_to_share = true
allow_share_to_asset = true

[[route_policies]]
id = "base"

# Chain entries stay intentionally small: endpoints, enabled protocol sets, and the route policy to use.
# Stream initialization bounds individual replay/bootstrap operations and the first RFQ update.
# Tycho bootstrap spans construction through complete state; established head mismatch has its own window.
[[chains]]
chain_id = 1
stream_initialization_timeout_secs = 25
chain_head_poll_interval_ms = 1000
chain_head_rpc_request_timeout_ms = 2000
chain_head_observation_max_age_secs = 15
tycho_initial_bootstrap_timeout_secs = 900
tycho_head_mismatch_recovery_timeout_secs = 60
recovery_max_buffered_native_blocks = 8
token_max_days_since_last_trade = 42
tycho_url = "tycho-beta.propellerheads.xyz"
bebop_url = "https://api.bebop.xyz/pmm/ethereum/v3/tokens"
hashflow_filename = "./hashflow_supported_tokens.csv"
liquorice_url = "https://api.liquorice.tech/v1/solver/supported-tokens"
native_protocols = [
    "uniswap_v2",
    "sushiswap_v2",
    "pancakeswap_v2",
    "uniswap_v3",
    "pancakeswap_v3",
    "ekubo_v2",
    "fluid_v1",
    "rocketpool",
    "ekubo_v3",
    "erc4626",
]
broadcaster_only_native_protocols = ["uniswap_v4", "uniswap_v4_hooks", "ring_swap_v2", "sky", "lido_v4", "etherfi", "aero_basic", "aero_cl"]
vm_protocols = ["vm:curve", "vm:balancer_v2", "vm:maverick_v2"]
broadcaster_only_vm_protocols = ["vm:balancer_v3", "vm:liquidityparty"]
# Ethereum v4 is broadcast-only until one guarded simulator subscription can retain the VM set.
# TODO: Liquorice simulation is wired, but our current router doesn't support it. We'll revisit it in the future.
rfq_protocols = ["rfq:bebop", "rfq:native", "rfq:metric", "rfq:hashflow"]
# Titan publishes independently of mined blocks. Metric uses its direct book feed once.
broadcaster_only_rfq_protocols = ["pricelevelstream:fermiswap", "pricelevelstream:kipseli", "pricelevelstream:bebop", "pricelevelstream:taurusfi", "pricelevelstream:tempest", "pricelevelstream:goliath", "pricelevelstream:stelaxis", "pricelevelstream:elzorro"]
route_policy = "ethereum"

[[chains]]
chain_id = 8453
stream_initialization_timeout_secs = 10
chain_head_poll_interval_ms = 500
chain_head_rpc_request_timeout_ms = 2000
chain_head_observation_max_age_secs = 5
tycho_initial_bootstrap_timeout_secs = 300
tycho_head_mismatch_recovery_timeout_secs = 60
# Base produces a block every 200ms, so a 60s startup or recovery handoff can buffer about
# 300 blocks. Stay above that so the time limit ends a slow handoff, not a block cap that
# expires before a 14-25s snapshot build finishes.
recovery_max_buffered_native_blocks = 512
token_max_days_since_last_trade = 1
tycho_url = "tycho-base-beta.propellerheads.xyz"
bebop_url = "https://api.bebop.xyz/pmm/base/v3/tokens"
hashflow_filename = "./hashflow_supported_tokens.csv"
native_protocols = [
    "uniswap_v2",
    "uniswap_v3",
    "uniswap_v4",
    "pancakeswap_v3",
    "aerodrome_slipstreams",
]
# Additional sources for downstream consumers. The standalone simulator retains its existing
# quoting selection; consumers enable and simulate these sources themselves.
broadcaster_only_native_protocols = ["aerodrome_v1", "sushiswap_v2", "aero_basic", "aero_cl", "pancakeswap_infinity_cl", "lunarbase", "ekubo_v3"]
vm_protocols = []
rfq_protocols = ["rfq:bebop", "rfq:native", "rfq:metric"]
route_policy = "base"
