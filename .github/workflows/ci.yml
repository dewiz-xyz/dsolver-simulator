name: ci

on:
  pull_request:
    branches:
      - master
      - shadow
      - staging
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --locked --workspace
      - name: Run documentation tests
        run: cargo test --locked --workspace --doc

  state-history-storage:
    name: state history storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Verify state history storage contract
        run: scripts/verify_state_history.sh --repo .

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build simulator release binary
        run: cargo build --locked -p apps --bin dsolver-simulator-service --release
      - name: Build broadcaster release binary
        run: cargo build --locked -p apps --bin dsolver-tycho-broadcaster-service --release
      - name: Build state history migration binary
        run: cargo build --locked -p apps --bin state-history-migrate --release
      - name: Build historical quote service
        run: cargo build --locked -p historical-quote-service --release
      - name: Build dsolver history CLI
        run: cargo build --locked -p dsolver-history --release
      - name: Check historical API contract
        run: cargo test --locked -p historical-quote --test contract checked_in_openapi_matches_rust_types
