name: Deploy Broadcaster

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target stack
        required: true
        type: choice
        options:
          - staging-solve-base
          - broadcaster-production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  build-and-deploy:
    name: Build & Deploy Broadcaster (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'broadcaster-production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        id: ecr-login

      - name: Install verified Buildx
        run: bash scripts/install-verified-buildx.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: |
            image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Resolve ECR repository
        id: ecr-repository
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "broadcaster-production" ]; then
            REPOSITORY="tycho-broadcaster-production"
          else
            REPOSITORY="tycho-broadcaster-$TARGET"
          fi
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ./Dockerfile.broadcaster-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.ecr-repository.outputs.repository }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.ecr-repository.outputs.repository }}:latest
          cache-from: type=gha,scope=broadcaster-service-${{ inputs.target }}
          cache-to: type=gha,mode=max,scope=broadcaster-service-${{ inputs.target }}
          secrets: |
            github_token=${{ secrets.DEWIZ_EXECUTION_READ_TOKEN }}

      - name: Force deploy broadcaster ECS service
        if: inputs.target == 'staging-solve-base'
        env:
          CLUSTER: ${{ inputs.target }}
        run: |
          # The broadcaster service may not exist yet because its infra lands separately, so skip instead of failing.
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services broadcaster --region ${{ env.AWS_REGION }} --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service broadcaster --force-new-deployment --region ${{ env.AWS_REGION }} --query 'service.serviceName' --output text
          else
            echo "broadcaster service not ACTIVE in $CLUSTER (status: $STATUS), skipping force deploy"
          fi
