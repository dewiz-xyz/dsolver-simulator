name: Build & Push Simulator Image

on:
  push:
    branches:
      - staging
      - shadow
  workflow_dispatch:
    inputs:
      target:
        description: Target stack
        required: true
        type: choice
        options:
          - quoter-base
          - solve-base
          - shadow
          - staging-solve-base

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  determine-targets:
    name: Determine Targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      environment: ${{ steps.targets.outputs.environment }}
    steps:
      - id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGETS="[\"$INPUT_TARGET\"]"
            case "$INPUT_TARGET" in
              quoter-base|solve-base) ENV="production" ;;
              shadow|staging-solve-base) ENV="staging" ;;
            esac
          elif [ "$REF_NAME" = "shadow" ]; then
            TARGETS='["shadow"]'
            ENV="staging"
          elif [ "$REF_NAME" = "staging" ]; then
            TARGETS='["staging-solve-base"]'
            ENV="staging"
          fi
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push (${{ matrix.target }})
    needs: determine-targets
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-targets.outputs.environment }}
    strategy:
      matrix:
        target: ${{ fromJson(needs.determine-targets.outputs.targets) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        id: ecr-login

      - name: Install verified Buildx
        run: bash scripts/install-verified-buildx.sh

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver-opts: |
            image=moby/buildkit@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ./Dockerfile.simulator-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/tycho-simulator-${{ matrix.target }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/tycho-simulator-${{ matrix.target }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.PRIVATE_DEWIZ_GITHUB_TOKEN }}

      - name: Build & push broadcaster image
        if: matrix.target == 'staging-solve-base'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ./Dockerfile.broadcaster-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/tycho-broadcaster-${{ matrix.target }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/tycho-broadcaster-${{ matrix.target }}:latest
          cache-from: type=gha,scope=broadcaster-service-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=broadcaster-service-${{ matrix.target }}
          secrets: |
            github_token=${{ secrets.PRIVATE_DEWIZ_GITHUB_TOKEN }}

      - name: Force deploy ECS service
        if: matrix.target == 'shadow' || matrix.target == 'staging-solve-base'
        env:
          CLUSTER: ${{ matrix.target }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service tycho-simulator --force-new-deployment --region ${{ env.AWS_REGION }} --query 'service.serviceName' --output text

      - name: Force deploy broadcaster ECS service
        if: matrix.target == 'staging-solve-base'
        env:
          CLUSTER: ${{ matrix.target }}
        run: |
          # The broadcaster service may not exist yet because its infra lands separately, so skip instead of failing.
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services broadcaster --region ${{ env.AWS_REGION }} --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service broadcaster --force-new-deployment --region ${{ env.AWS_REGION }} --query 'service.serviceName' --output text
          else
            echo "broadcaster service not ACTIVE in $CLUSTER (status: $STATUS), skipping force deploy"
          fi
