name: Build Historical Pool Quote API

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: historical-pool-quote-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_HISTORICAL_QUOTE_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "607709788129"
          role-duration-seconds: 900
          role-session-name: historical-quote-image-build
          inline-session-policy: >-
            {
              "Version":"2012-10-17",
              "Statement":[
                {
                  "Sid":"EcrLogin",
                  "Effect":"Allow",
                  "Action":"ecr:GetAuthorizationToken",
                  "Resource":"*"
                },
                {
                  "Sid":"PushHistoricalQuoteImage",
                  "Effect":"Allow",
                  "Action":[
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:CompleteLayerUpload",
                    "ecr:InitiateLayerUpload",
                    "ecr:PutImage",
                    "ecr:UploadLayerPart"
                  ],
                  "Resource":"arn:aws:ecr:${{ env.AWS_REGION }}:607709788129:repository/${{ env.ECR_REPOSITORY }}"
                }
              ]
            }

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.historical-quote-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha,scope=historical-quote-service
          cache-to: type=gha,mode=max,scope=historical-quote-service
